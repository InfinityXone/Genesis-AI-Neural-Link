name: Hydrate Memory System

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  hydrate-memory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Hydrate Memory
        run: |
          mkdir -p .memory/vector_store .memory/semantic_index .memory/logs
          echo "Hydration timestamp: $(date)" >> .memory/logs/hydration.log
          echo '{ "status": "hydrated", "time": "'$(date)'" }' > .memory/system_state.json

      - name: Upload to GCS
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GCP_KEY }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS" > gcloud-key.json
          gcloud auth activate-service-account --key-file=gcloud-key.json
          gsutil -m cp -r .memory gs://infinity-swarm-system/${{ github.repository }}-memory
