name: Genesis Auto-Sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  push-genesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Push Genesis via CLI
        run: |
          git config user.name "Genesis Bot"
          git config user.email "bot@genesis.ai"
          git add .
          git commit -m "Autonomous sync from Genesis system"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GENESIS_PAT }}
